# The project website for the Kindle 10th generation port: the static files in
# site/, published as they are to GitHub Pages. No build step, nothing fetched.
# Runs only for pushes to kpw4 that touch the site or this file, or by hand.
# Needs Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [kpw4]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one that
# is half deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy are two jobs, as in GitHub's own Pages example. In one
  # job, deploy-pages asked for the artifact under a second after the upload
  # and was told there was none (2026-11-28, twice in a row; it was there when
  # asked again minutes later). The second job starts only once the first has
  # finished, which gives the artifact listing that time.
  build:
    name: package site/
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: publish site/
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
