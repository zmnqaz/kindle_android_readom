# libbt-vendor run-time configuration, read from /etc/bluetooth/bt_vendor.conf
# (hardware/broadcom/libbt/include/bt_vendor_brcm.h:53-55; keys in
# hardware/broadcom/libbt/src/conf.c:69-77).
UartPort = /dev/ttymxc2
FwPatchFilePath = /firmware/bluetooth/
# The stock patch the device side copies in under this fixed name (step 2 of
# PLAN.md decides which of /opt/brcm_4343w/bluetooth/firmware/*.hcd). A fixed
# name is needed: the automatic search matches the chip's local name as a
# prefix (src/hardware.c:440-480), and the ROM name (BCM43430A1?) is not a
# prefix of the stock file names (BCM4343A1_...).
FwPatchFileName = BCM4343A1.hcd
