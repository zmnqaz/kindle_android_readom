<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>这一页不存在 · Readom 第十代移植版</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<!-- 404 页会出现在任意路径下，相对路径找不到样式，所以样式内联、链接写全。 -->
<style>
  :root { --paper:#f5efe3; --ink:#2a2520; --muted:#74695c; --seal:#b03a2e; --seal-ink:#fbf6ec; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper:#1c1a17; --ink:#e9e2d4; --muted:#a69a88; --seal:#cf5a4b; --seal-ink:#1c1a17; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
         font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,serif; line-height:1.8; text-align:center; padding:2rem 1.25rem; box-sizing:border-box; }
  .seal { display:inline-grid; place-items:center; width:4rem; height:4rem; border-radius:4px; background:var(--seal); color:var(--seal-ink);
          font-size:1.4rem; font-weight:700; transform:rotate(-3deg); box-shadow: inset 0 0 0 3px var(--seal), inset 0 0 0 4.5px var(--seal-ink); }
  h1 { font-size:1.7rem; margin:1.5rem 0 .5rem; letter-spacing:.05em; }
  p { color:var(--muted); margin:.3rem 0; }
  a { color:inherit; text-decoration-color:var(--seal); text-underline-offset:.22em; }
  a:focus-visible { outline:2px solid #1f5fa8; outline-offset:3px; }
</style>
</head>
<body>
<main>
  <span class="seal" aria-hidden="true">缺页</span>
  <h1>这一页不存在</h1>
  <p>可能是链接写错了，或者页面已经挪走。</p>
  <p lang="en">This page does not exist.</p>
  <p style="margin-top:1.4rem"><a href="https://zmnqaz.github.io/readom/">回到首页</a> · <a href="https://zmnqaz.github.io/readom/en/" lang="en">Home (English)</a></p>
</main>
</body>
</html>
